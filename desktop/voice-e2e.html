<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>Purp voice transport test</title>
<style>.hidden { display: none !important; }</style>
<div id="voice-link-wrap" class="hidden"><input id="voice-link-projection" type="checkbox"></div>
<div id="voice-video-volume-wrap" class="hidden"><input id="voice-video-volume" type="range"></div>
<form id="voice-create-form"><input id="voice-room-name"><button type="submit">Criar</button></form>
<span id="voice-room-count"></span><div id="voice-room-list"></div>
<p id="voice-section-status"></p>
<section id="voice-dock" class="hidden">
  <strong id="voice-dock-title"></strong><span id="voice-dock-count"></span>
  <button id="voice-dock-mute"></button><button id="voice-dock-expand"></button><button id="voice-dock-leave"></button>
  <button id="voice-screen-share"></button>
  <div id="voice-dock-body" class="hidden">
    <p id="voice-dock-status"></p>
    <button id="voice-screen-watch" class="hidden"></button>
    <div id="voice-screen-view" class="hidden">
      <strong id="voice-screen-label"></strong><button id="voice-screen-minimize"></button>
      <button id="voice-screen-fullscreen"></button><button id="voice-screen-close"></button>
      <video id="voice-screen-video" autoplay playsinline muted></video><p id="voice-screen-waiting"></p>
    </div>
    <div id="voice-participant-list"></div>
  </div>
</section>
<script>
  const { ipcRenderer } = require('electron');
  const userId = new URLSearchParams(location.search).get('id');
  const listeners = new Map();
  let nextAck = 0;
  const pending = new Map();
  window.io = () => ({
    id: userId, connected: true,
    on(name, handler) { const group = listeners.get(name) || []; group.push(handler); listeners.set(name, group); },
    emit(name, payload, callback) {
      if (typeof callback === 'function') {
        const ack = ++nextAck; pending.set(ack, callback);
        ipcRenderer.send('test:emit', { userId, name, payload, ack });
      } else ipcRenderer.send('test:emit', { userId, name, payload });
    },
    timeout() { return { emit: (name, payload, callback) => {
      const ack = ++nextAck; pending.set(ack, callback);
      ipcRenderer.send('test:emit', { userId, name, payload, ack });
    } }; },
  });
  ipcRenderer.on('test:event', (_event, { name, payload }) => {
    for (const handler of listeners.get(name) || []) handler(payload);
  });
  ipcRenderer.on('test:ack', (_event, { ack, result }) => {
    pending.get(ack)?.(null, result); pending.delete(ack);
  });
  const audioContext = new AudioContext();
  const oscillator = audioContext.createOscillator();
  const audioDestination = audioContext.createMediaStreamDestination();
  oscillator.connect(audioDestination); oscillator.start();
  const screenOscillator = audioContext.createOscillator();
  screenOscillator.frequency.value = 880;
  const screenDestination = audioContext.createMediaStreamDestination();
  screenOscillator.connect(screenDestination); screenOscillator.start();
  const canvas = document.createElement('canvas'); canvas.width = 640; canvas.height = 360;
  const paint = canvas.getContext('2d');
  let frame = 0;
  setInterval(() => {
    paint.fillStyle = frame++ % 2 ? '#8527bc' : '#35aaeb';
    paint.fillRect(0, 0, canvas.width, canvas.height);
  }, 50);
  Object.defineProperty(navigator.mediaDevices, 'getUserMedia', {
    configurable: true, value: async () => audioDestination.stream,
  });
  Object.defineProperty(navigator.mediaDevices, 'getDisplayMedia', {
    configurable: true, value: async options => {
      window.captureOptions = options;
      window.lastCapture = canvas.captureStream(20);
      if (window.testCaptureAudio !== false)
        window.lastCapture.addTrack(screenDestination.stream.getAudioTracks()[0].clone());
      return window.lastCapture;
    },
  });
  window.testSocketEvent = (name, payload) => {
    for (const handler of listeners.get(name) || []) handler(payload);
  };
  const nativePeers = new Map();
  const nativeCandidates = new Map();
  const nativeAudioChannels = new Map();
  const nativeAudioFrame = new Int16Array(960);
  for (let i = 0; i < nativeAudioFrame.length; i++)
    nativeAudioFrame[i] = Math.round(Math.sin(i * Math.PI * 2 * 440 / 48000) * 9000);
  const nativeAudioTimer = setInterval(() => {
    for (const channel of nativeAudioChannels.values())
      if (channel.readyState === 'open' && channel.bufferedAmount < 96000)
        channel.send(nativeAudioFrame.buffer);
  }, 20);
  const sendNative = (to, type, data) =>
    ipcRenderer.send('test:emit', { userId, name: 'voice:signal', payload: { to, type, data } });
  const nativeSignals = listeners.get('voice:signal') || [];
  nativeSignals.push(async ({ from, type, data }) => {
    const pc = nativePeers.get(from);
    if (!pc) return;
    if (type === 'screen-answer') {
      await pc.setRemoteDescription({ type: 'answer', sdp: data.sdp });
      for (const candidate of nativeCandidates.get(from) || [])
        await pc.addIceCandidate(candidate);
      nativeCandidates.delete(from);
    } else if (type === 'screen-candidate') {
      if (pc.remoteDescription) await pc.addIceCandidate(data);
      else {
        if (!nativeCandidates.has(from)) nativeCandidates.set(from, []);
        nativeCandidates.get(from).push(data);
      }
    }
  });
  listeners.set('voice:signal', nativeSignals);
  window.testStartNativeShare = async viewers => {
    await new Promise((resolve, reject) => window.io().emit('voice:share', { sharing: true },
      (_error, result) => result?.success ? resolve() : reject(new Error('Falha ao iniciar tela nativa simulada'))));
    const video = canvas.captureStream(20).getVideoTracks()[0];
    for (const id of viewers) {
      const pc = new RTCPeerConnection();
      nativePeers.set(id, pc);
      nativeAudioChannels.set(id, pc.createDataChannel('screen-audio',
        { ordered: true, maxRetransmits: 0 }));
      pc.addTrack(video);
      pc.onicecandidate = event => {
        if (event.candidate) sendNative(id, 'screen-candidate', event.candidate.toJSON());
      };
      await pc.setLocalDescription(await pc.createOffer());
      sendNative(id, 'screen-offer', { sdp: pc.localDescription.sdp });
    }
  };
  window.testStopNativeShare = async () => {
    clearInterval(nativeAudioTimer);
    for (const channel of nativeAudioChannels.values()) channel.close();
    nativeAudioChannels.clear();
    for (const pc of nativePeers.values()) pc.close();
    nativePeers.clear(); nativeCandidates.clear();
    await new Promise(resolve => window.io().emit('voice:share', { sharing: false }, () => resolve()));
  };
</script>
<script type="module">
  window.testNativeAudioStarts = 0;
  const originalBufferStart = AudioBufferSourceNode.prototype.start;
  AudioBufferSourceNode.prototype.start = function(...args) {
    window.testNativeAudioStarts++;
    return originalBufferStart.apply(this, args);
  };
  import { initializeVoice } from '/script/voice.js';
  initializeVoice();
  window.testSocketEvent('room-permissions', { roomId: 'geral', role: 'MEMBER' });
  window.voiceTestReady = true;
</script>
</html>
