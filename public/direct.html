<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Mensagens privadas | Chat Amino 2</title>
  <link rel="stylesheet" href="/style/direct.css?v=2">
  <link rel="stylesheet" href="/style/notification-badge.css?v=1">
  <script src="/socket.io/socket.io.js"></script>
  <script src="/script/notification-badge.js?v=2" defer></script>
  <script type="module" src="/script/direct.js?v=4"></script>
</head>
<body>
  <div class="dm-shell">
    <aside class="dm-sidebar" id="dm-sidebar">
      <header class="dm-brand"><a href="/index.html">✳ Chat Amino 2</a><a href="/notifications.html" class="notification-link" aria-label="Notificações">🔔 <span class="notification-badge hidden">0</span></a><a href="/perfil.html">Perfil</a></header>
      <div class="dm-heading"><h1>Mensagens</h1><button id="dm-settings-open" type="button" aria-label="Preferências de mensagens">⚙</button></div>
      <nav class="dm-tabs" aria-label="Mensagens privadas"><button type="button" data-tab="chats" class="active">Conversas</button><button type="button" data-tab="requests">Solicitações <span id="dm-request-count"></span></button><button type="button" data-tab="archived">Arquivadas</button></nav>
      <label class="dm-search-label">Pesquisar conversas<input id="dm-search" type="search" placeholder="Nome da pessoa"></label>
      <div id="dm-list" class="dm-list" aria-live="polite"></div>
      <button id="dm-list-more" type="button" class="hidden">Carregar mais</button>
      <p id="dm-list-status" role="status"></p>
    </aside>
    <main class="dm-main" id="dm-main">
      <div id="dm-empty" class="dm-empty"><span>✳</span><h2>Suas conversas em um só lugar</h2><p>Abra o perfil de alguém e toque em “Mensagem” para começar.</p></div>
      <section id="dm-conversation" class="dm-conversation hidden" aria-label="Conversa privada">
        <header class="dm-chat-header"><button type="button" id="dm-back" aria-label="Voltar às conversas">‹</button><a id="dm-person" href="#"></a><span id="dm-person-status"></span><button type="button" id="dm-more" aria-label="Opções da conversa" aria-expanded="false">⋮</button></header>
        <div id="dm-options" class="dm-options hidden"><button type="button" id="dm-search-messages">Buscar mensagens</button><button type="button" data-setting="muted">Silenciar</button><button type="button" data-setting="pinned">Fixar</button><button type="button" data-setting="archived">Arquivar</button><button type="button" id="dm-block">Bloquear</button><button type="button" id="dm-report-open">Denunciar</button></div>
        <form id="dm-message-search" class="dm-message-search hidden" role="search"><input id="dm-message-search-text" type="search" maxlength="100" placeholder="Palavra-chave" aria-label="Palavra-chave"><select id="dm-message-search-author" aria-label="Autor"><option value="">Todos</option><option value="me">Eu</option><option value="other">Outra pessoa</option></select><select id="dm-message-search-type" aria-label="Tipo"><option value="">Todos os tipos</option><option value="TEXT">Texto</option><option value="AUDIO">Áudio</option><option value="STICKER">Figurinha</option><option value="IMAGE">Imagem</option></select><label>De<input id="dm-message-search-from" type="date"></label><label>Até<input id="dm-message-search-to" type="date"></label><button type="submit">Buscar</button><button id="dm-message-search-clear" type="button">Limpar</button></form>
        <div id="dm-request-actions" class="dm-request-actions hidden"><p>Esta pessoa quer conversar com você.</p><button id="dm-accept" type="button">Aceitar</button><button id="dm-decline" type="button">Recusar</button><button id="dm-request-block" type="button">Bloquear</button><button id="dm-request-report" type="button">Denunciar</button></div>
        <div id="dm-messages" class="dm-messages" aria-live="polite"></div>
        <button id="dm-more-messages" type="button" class="hidden">Carregar anteriores</button>
        <p id="dm-typing" role="status"></p>
        <div id="dm-reply" class="dm-reply hidden"><span id="dm-reply-label"></span><button id="dm-reply-cancel" type="button">×</button></div>
        <form id="dm-compose" class="dm-compose"><button id="dm-sticker-open" type="button" aria-label="Enviar figurinha">▧</button><label class="dm-upload" aria-label="Enviar imagem">＋<input id="dm-image" type="file" accept="image/png,image/jpeg,image/webp" hidden></label><button id="dm-record" type="button" aria-label="Gravar áudio">🎙</button><input id="dm-input" maxlength="2000" autocomplete="off" placeholder="Mensagem privada"><button type="submit" aria-label="Enviar">➤</button></form>
        <p id="dm-chat-status" role="status"></p>
      </section>
    </main>
  </div>
  <dialog id="dm-settings" class="dm-dialog"><div class="dm-dialog-head"><h2>Privacidade e status</h2><button type="button" data-close="dm-settings">×</button></div><label>Quem pode me enviar mensagens<select id="dm-privacy"><option value="EVERYONE">Todos</option><option value="FOLLOWERS">Apenas seguidores</option><option value="FOLLOWING">Apenas pessoas que sigo</option><option value="NOBODY">Ninguém</option></select></label><label>Meu status<select id="dm-presence"><option value="ONLINE">Online</option><option value="AWAY">Ausente</option><option value="BUSY">Ocupado</option><option value="INVISIBLE">Invisível</option></select></label><label>Mensagem de status<input id="dm-status-text" maxlength="100"></label><button type="button" id="dm-settings-save">Salvar</button><h3>Usuários bloqueados</h3><div id="dm-blocks"></div><p id="dm-settings-status" role="status"></p></dialog>
  <dialog id="dm-stickers" class="dm-dialog"><div class="dm-dialog-head"><h2>Figurinhas</h2><button type="button" data-close="dm-stickers">×</button></div><div id="dm-sticker-grid"></div><p id="dm-sticker-status"></p></dialog>
  <dialog id="dm-report" class="dm-dialog"><div class="dm-dialog-head"><h2>Denunciar conversa</h2><button type="button" data-close="dm-report">×</button></div><label>Motivo<select id="dm-report-reason"><option value="SPAM">Spam</option><option value="HARASSMENT">Assédio</option><option value="INAPPROPRIATE">Conteúdo impróprio</option><option value="OTHER">Outro</option></select></label><label>Detalhes (opcional)<input id="dm-report-details" maxlength="500"></label><button type="button" id="dm-report-send">Enviar denúncia</button><p id="dm-report-status" role="status"></p></dialog>
  <nav class="dm-bottom-nav" aria-label="Navegação principal"><a href="/index.html" aria-current="page">▤<small>Chats</small></a><a href="/index.html#communities">◎<small>Comunidades</small></a><a href="/index.html?sala=geral#projections">▣<small>Projeções</small></a><a href="/perfil.html">◉<small>Perfil</small></a></nav>
</body>
</html>
