<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Criar conta | Purp</title>
  <link rel="stylesheet" href="style/auth.css?v=3">
  <script src="script/cadastro.js" defer></script>
  <link rel="icon" type="image/png" href="/image/purp-mascot.png">
  <meta name="theme-color" content="#0B0716">
  <meta name="description" content="Purp: comunidades, conversas, publicações, eventos e projeções.">
  <link rel="stylesheet" href="/style/purpverse.css?v=5">
  <script src="/script/purpverse-shell.js?v=3"></script>
</head>
<body>
  <main class="auth-page">
    <div class="auth-shell">
      <section class="auth-card" aria-labelledby="auth-title">
        <a class="auth-brand" href="/"><span class="pv-logo" aria-hidden="true"></span><span class="pv-brand-name">Purp</span></a>
        <div class="auth-card-heading">
          <span class="auth-card-kicker">FAÇA PARTE</span>
          <h1 id="auth-title">Crie sua conta<span>.</span></h1>
          <p class="auth-description">Escolha seu nome e entre para a comunidade.</p>
        </div>

        <form id="cadastro-form">
          <label for="username">Nome de usuário</label>
          <input type="text" id="username" name="username" placeholder="Como quer ser chamado?" minlength="3" maxlength="30" autocomplete="username" required>
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="voce@exemplo.com" autocomplete="email" required>
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" placeholder="Pelo menos 6 caracteres" minlength="6" autocomplete="new-password" required>
          <button type="submit" id="submit-button">Criar conta</button>
          <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
        </form>

        <p class="auth-link">Já tem uma conta? <a href="/login.html">Entrar <span aria-hidden="true">↗</span></a></p>
        <p class="auth-link"><a href="/rules.html">Regras</a> · <a href="/privacy.html">Privacidade</a></p>
      </section>
    </div>
  </main>
</body>
</html>
