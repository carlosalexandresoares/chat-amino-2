<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Meu perfil</title>

  <link rel="stylesheet" href="/style/profile.css?v=5">
  <script src="/socket.io/socket.io.js"></script>
  <script src="/script/perfil.js?v=7" defer></script>
</head>

<body>
  <div id="level-toast" class="level-toast hidden" role="status"></div>
  <main class="profile-page">
    <section class="profile-card">
      <nav class="profile-nav" aria-label="Navegação do perfil">
        <a href="/index.html">← Voltar aos chats</a>
        <a href="/admin.html" id="site-admin-link" class="hidden">Administração</a>
        <span>✳ CHAT AMINO 2</span>
      </nav>

      <div
        class="profile-banner"
        id="profile-banner"
      ></div>

      <div class="profile-content">

        <div
          class="profile-avatar"
          id="profile-avatar"
        >
          ?
        </div>

        <span class="profile-eyebrow">PERFIL DA COMUNIDADE</span>
        <h1 id="profile-username">
          Carregando...
        </h1>
        <p id="profile-load-message" class="profile-load-message hidden" role="alert"></p>

        <div class="profile-quick-actions">
          <div class="level-badge">
            <span id="profile-level">LV 1</span>
          </div>
          <span id="profile-title" class="ninja-title"></span>
          <a href="/editar-perfil.html" class="edit-profile-button hidden" id="edit-profile-button">Editar perfil</a>
          <button type="button" id="follow-button" class="follow-button hidden">Seguir</button>
        </div>

        <div class="profile-stats">
          <div><strong id="profile-posts-count">0</strong><span>Posts</span></div>
          <button type="button" id="profile-following-button" aria-label="Ver pessoas que está seguindo"><strong id="profile-following-count">0</strong><span>Seguindo</span></button>
          <button type="button" id="profile-followers-button" aria-label="Ver seguidores"><strong id="profile-followers-count">0</strong><span>Seguidores</span></button>
        </div>

        <div class="profile-bio-card">
          <span class="profile-section-label">SOBRE MIM</span>
          <p id="profile-bio">Este usuário ainda não adicionou uma biografia.</p>
        </div>

        <div class="xp-area">
          <div class="xp-header">
            <span>Experiência</span>

            <span id="profile-xp">
              0 XP
            </span>
          </div>

          <div class="xp-bar">
            <div
              class="xp-progress"
              id="xp-progress"
            ></div>
          </div>
          <p id="profile-next-xp" class="reputation-detail"></p>
          <p id="profile-rank" class="reputation-detail"></p>
        </div>

        <section class="reputation-panel">
          <h2>Check-in ninja</h2>
          <p id="checkin-status"></p>
          <button type="button" id="checkin-button" class="follow-button hidden">Fazer check-in</button>
        </section>

        <section class="reputation-panel">
          <h2>Ranking de reputação</h2>
          <label for="ranking-period">Período</label>
          <select id="ranking-period"><option value="daily">Diário</option><option value="weekly">Semanal</option><option value="monthly">Mensal</option><option value="all">Geral</option></select>
          <ol id="ranking-list"></ol>
          <button type="button" id="ranking-more" class="follow-button hidden">Carregar mais</button>
        </section>

        <p
          class="profile-email"
          id="profile-email"
        ></p>

        <section class="profile-posts">
          <div class="profile-post-heading"><span class="profile-section-label">ATIVIDADE</span><h2>Posts</h2></div>
          <form id="new-post-form" class="hidden">
            <textarea id="new-post-content" maxlength="1000" required placeholder="Compartilhe algo com a comunidade..."></textarea>
            <button type="submit">Publicar</button>
          </form>
          <p id="profile-message" role="alert"></p>
          <div id="profile-post-list"></div>
        </section>

        <div class="profile-actions">
          <a href="/index.html">
            Ver chats
          </a>

          <button
            id="logout-button"
            type="button"
          >
            Sair
          </button>
        </div>

      </div>
    </section>
    <dialog id="connections-dialog" class="connections-dialog" aria-labelledby="connections-title">
      <div class="connections-heading"><div><span class="profile-section-label">PESSOAS</span><h2 id="connections-title">Seguidores</h2></div><button type="button" id="close-connections" aria-label="Fechar lista">✕</button></div>
      <p id="connections-message" role="status"></p>
      <div id="connections-list" class="connections-list"></div>
      <button type="button" id="load-more-connections" class="load-more-connections hidden">Carregar mais</button>
    </dialog>
  </main>
</body>

</html>
