<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Vídeo da projeção</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    .youtube-stage { position: relative; width: 100%; height: 100%; background: #000; }
    #youtube-frame, .youtube-stage iframe { display: block; width: 100%; height: 100%; }
    .viewer-overlay { position: absolute; inset: 0; display: flex; align-items: flex-end; justify-content: flex-end; padding: 10px; pointer-events: none; }
    .viewer-overlay button { pointer-events: auto; padding: 8px 11px; border: 1px solid #fff5; border-radius: 999px; background: #0c111fda; color: #fff; font: 700 11px system-ui, sans-serif; cursor: pointer; }
    .hidden { display: none !important; }
  </style>
</head>
<body></body>
</html>
